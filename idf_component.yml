version: "2.0.0"
description: "Framework-neutral MCP45HVX1 high-voltage I2C digital potentiometer driver"
license: "MIT"
url: "https://github.com/janhavelka/MCP45HVX1"
repository: "https://github.com/janhavelka/MCP45HVX1.git"
targets:
  - esp32s2
  - esp32s3
dependencies:
  idf: ">=6.0.1"
files:
  exclude:
    - ".github/**/*"
    - ".pio/**/*"
    - ".vscode/**/*"
    - "**/__pycache__/**/*"
    - "**/*.pyc"
    - "test/**/*"
    - "tests/**/*"
    - "tools/**/*"
    - "scripts/**/*"
    - "examples/01_basic_bringup_cli/**/*"
    - "examples/common/**/*"
    - "docs/**/*.pdf"
    - "AGENTS.md"
    - "docs/CODE_AUDIT.md"
    - "docs/CODE_AUDIT_RESOLUTION.md"
    - "CODEOWNERS"
    - "Doxyfile"
    - "Doxyfile.api"
    - "platformio.ini"
    - "*.tar.gz"
    - "*.tgz"
    - "*.zip"
