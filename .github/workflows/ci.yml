name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMIO_VERSION: "6.1.19"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Enforce ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Check generated artifacts
        run: python tools/check_generated_artifacts.py

      - name: Test HIL evidence parser
        run: python tools/test_run_hil_mcp45hvx1_parser.py

      - name: Test tooling regression guards
        run: python tools/test_contract_tools.py

      - name: Run HIL runner parser self-test
        run: python tools/run_hil_mcp45hvx1.py --parser-self-test

      - name: Run native tests
        run: pio test -e native

      - name: Test Arduino CLI recovery and argument handling
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror=return-type -I. -Iinclude -Iexamples -Itest/stubs tests/test_arduino_cli.cpp src/MCP45HVX1.cpp -o "$RUNNER_TEMP/arduino-cli-test"
          "$RUNNER_TEMP/arduino-cli-test"

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-validate-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini', 'library.json') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Validate library package
        run: pio pkg pack

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen 1.15.0
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/doxygen.tar.gz" https://github.com/doxygen/doxygen/releases/download/Release_1_15_0/doxygen-1.15.0.linux.bin.tar.gz
          echo "0ec2e5b2c3cd82b7106d19cb42d8466450730b8cb7a9e85af712be38bf4523a1  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.15.0/bin" >> "$GITHUB_PATH"

      - name: Require public API documentation
        run: doxygen Doxyfile.api

      - name: Build documentation with warnings as errors
        run: doxygen Doxyfile

  idf-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s3
          - esp32s2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build ESP-IDF example for ${{ matrix.target }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.1
          target: ${{ matrix.target }}
          path: examples/espidf_basic
          command: idf.py set-target ${{ matrix.target }} build

      - name: Upload ESP-IDF build logs for ${{ matrix.target }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp-idf-build-logs-${{ matrix.target }}
          path: |
            examples/espidf_basic/build/**/*.log
            examples/espidf_basic/build/log/**
          if-no-files-found: ignore
